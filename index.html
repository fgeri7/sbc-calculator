// Auto-fill the search range from the target rating (target-5 / target+3),
// clamped to the valid 1-99 range. The fields stay fully editable afterward —
// this only runs again if the target itself changes.
function updateMinMaxFromTarget() {
  const t = parseInt(els.target.value, 10);
  if (Number.isNaN(t)) return;
  els.minR.value = Math.max(1, t - 5);
  els.maxR.value = Math.min(99, t + 3);
  els.minR.dispatchEvent(new Event('input'));
  els.maxR.dispatchEvent(new Event('input'));
}

// Dual-thumb range slider for the min/max rating fields. The two native
// range inputs are overlaid (their tracks are transparent and non-interactive
// so only the thumbs can be grabbed), with a highlighted fill bar between them.
const SLIDER_MIN = 75;
const SLIDER_MAX = 99;
let sliderSyncing = false;

function updateSliderFill() {
  const mn = parseInt(els.minRSlider.value, 10);
  const mx = parseInt(els.maxRSlider.value, 10);
  const range = SLIDER_MAX - SLIDER_MIN;
  const leftPct = ((mn - SLIDER_MIN) / range) * 100;
  const rightPct = ((mx - SLIDER_MIN) / range) * 100;
  els.rangeTrackFill.style.left = leftPct + '%';
  els.rangeTrackFill.style.width = Math.max(0, rightPct - leftPct) + '%';
}

function syncSliderFromFields() {
  if (sliderSyncing) return;
  sliderSyncing = true;
  let mn = parseInt(els.minR.value, 10);
  let mx = parseInt(els.maxR.value, 10);
  if (Number.isNaN(mn)) mn = SLIDER_MIN;
  if (Number.isNaN(mx)) mx = SLIDER_MAX;
  mn = Math.min(Math.max(mn, SLIDER_MIN), SLIDER_MAX);
  mx = Math.min(Math.max(mx, SLIDER_MIN), SLIDER_MAX);
  els.minRSlider.value = mn;
  els.maxRSlider.value = mx;
  updateSliderFill();
  sliderSyncing = false;
}

els.minRSlider.addEventListener('input', () => {
  if (sliderSyncing) return;
  sliderSyncing = true;
  let mn = parseInt(els.minRSlider.value, 10);
  const mx = parseInt(els.maxRSlider.value, 10);
  if (mn > mx) { mn = mx; els.minRSlider.value = mn; }
  els.minR.value = mn;
  els.minR.dispatchEvent(new Event('input'));
  updateSliderFill();
  sliderSyncing = false;
});

els.maxRSlider.addEventListener('input', () => {
  if (sliderSyncing) return;
  sliderSyncing = true;
  const mn = parseInt(els.minRSlider.value, 10);
  let mx = parseInt(els.maxRSlider.value, 10);
  if (mx < mn) { mx = mn; els.maxRSlider.value = mx; }
  els.maxR.value = mx;
  els.maxR.dispatchEvent(new Event('input'));
  updateSliderFill();
  sliderSyncing = false;
});

els.minR.addEventListener('input', syncSliderFromFields);
els.maxR.addEventListener('input', syncSliderFromFields);
syncSliderFromFields();

// Builds a horizontally-scrollable strip of rating buttons (99 down to 75 by
// default) inside `container`, calling onSelect(value, btnEl) when tapped.
function buildRatingSlider(container, onSelect, values) {
  const vals = values || Array.from({ length: 25 }, (_, i) => 99 - i); // 99..75
  container.innerHTML = '';
  vals.forEach(v => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.val = v;
    btn.textContent = v;
    btn.addEventListener('click', () => onSelect(v, btn));
    container.appendChild(btn);
  });
}

// Scrolls the strip so the given value sits at the left edge.
function scrollSliderTo(container, value) {
  const btn = container.querySelector(`button[data-val="${value}"]`);
  if (!btn) return;
  const containerRect = container.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  container.scrollLeft += (btnRect.left - containerRect.left);
}

const quickTargetEl = document.getElementById('quickTarget');
buildRatingSlider(quickTargetEl, (v, btn) => {
  els.target.value = v;
  els.target.dispatchEvent(new Event('input'));
  quickTargetEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  updateMinMaxFromTarget();
});
els.target.addEventListener('input', () => {
  quickTargetEl.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.val === els.target.value.trim());
  });
  updateMinMaxFromTarget();
});
(window.requestAnimationFrame || (cb => setTimeout(cb, 0)))(() => scrollSliderTo(quickTargetEl, 91));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => scrollSliderTo(quickTargetEl, 91));
}

[els.target, els.players, els.minR, els.maxR, els.maxPerRating, els.preferred1, els.preferred2, els.preferred3].forEach(input => {
  input.addEventListener('keydown', e => { if (e.key === 'Enter') runCalculation(); });
});

// Clear (×) buttons for number fields: visible only when the field has a
// value, click empties it and returns focus to the input.
function syncFieldClearButtons() {
  document.querySelectorAll('.field-clear').forEach(btn => {
    const input = document.getElementById(btn.dataset.clear);
    if (input) btn.classList.toggle('visible', input.value.trim() !== '');
  });
}
document.querySelectorAll('.field-clear').forEach(btn => {
  const targetId = btn.dataset.clear;
  const input = document.getElementById(targetId);
  input.addEventListener('input', syncFieldClearButtons);
  btn.addEventListener('click', () => {
    input.value = '';
    syncFieldClearButtons();
  });
});
syncFieldClearButtons();

// Tab switching (Calculator / How it works)
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'tabReverse') {
      scrollSliderTo(quickOwnedEl, 91);
      scrollSliderTo(quickReverseTargetEl, 91);
    }
    if (btn.scrollIntoView) {
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });
});

// Advanced options toggle (preferred ratings + mandatory cards section).
// The sliders inside are built while hidden, so their positions can't be
// measured correctly until the section is actually visible — re-scroll them
// into place the first time (and every time) the section is shown.
function positionAdvancedSliders() {
  document.querySelectorAll('.quick-select[data-quick-target]').forEach(group => scrollSliderTo(group, 90));
  scrollSliderTo(document.getElementById('quickMandatory'), 90);
}
els.toggleAdvanced.addEventListener('change', () => {
  els.advancedSection.style.display = els.toggleAdvanced.checked ? '' : 'none';
  if (els.toggleAdvanced.checked) {
    const raf = window.requestAnimationFrame || (cb => setTimeout(cb, 0));
    raf(positionAdvancedSliders);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(positionAdvancedSliders);
    }
  }
});

// Quick-select sliders under the preferred-rating fields (same 75-99 strip,
// scrolled by default to show 88 at the left edge)
document.querySelectorAll('.quick-select[data-quick-target]').forEach(group => {
  const input = document.getElementById(group.dataset.quickTarget);
  buildRatingSlider(group, (v, btn) => {
    input.value = v;
    input.dispatchEvent(new Event('input'));
    group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  });
});

// Quick-select slider under the mandatory-cards field: tapping a value adds
// it straight away (same 75-99 strip, 88 at the left edge by default)
const quickMandatoryEl = document.getElementById('quickMandatory');
buildRatingSlider(quickMandatoryEl, v => {
  mandatoryList.push(v);
  renderMandatoryChips();
});

// Quick-select slider under the owned-cards field (What can I build? tab):
// same 99-75 strip as the target rating, 91 at the left edge by default.
const quickOwnedEl = document.getElementById('quickOwned');
buildRatingSlider(quickOwnedEl, v => {
  ownedList.push(v);
  renderOwnedChips();
});
(window.requestAnimationFrame || (cb => setTimeout(cb, 0)))(() => scrollSliderTo(quickOwnedEl, 91));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => scrollSliderTo(quickOwnedEl, 91));
}

// Quick-select slider under the "desired squad rating" field in the
// What-can-I-build tab: same behavior as the main target field (fills the
// number field rather than adding a card), 91 at the left edge by default.
const quickReverseTargetEl = document.getElementById('quickReverseTarget');
buildRatingSlider(quickReverseTargetEl, (v, btn) => {
  els.reverseTarget.value = v;
  els.reverseTarget.dispatchEvent(new Event('input'));
  quickReverseTargetEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
});
els.reverseTarget.addEventListener('input', () => {
  quickReverseTargetEl.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.val === els.reverseTarget.value.trim());
  });
});
(window.requestAnimationFrame || (cb => setTimeout(cb, 0)))(() => scrollSliderTo(quickReverseTargetEl, 91));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => scrollSliderTo(quickReverseTargetEl, 91));
}

// Floating back-to-top button, visible on every tab once the page is scrolled down
const floatingTopBtn = document.getElementById('floatingTop');
window.addEventListener('scroll', () => {
  floatingTopBtn.classList.toggle('visible', window.scrollY > 400);
});
floatingTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Initialize in English by default
// Initialize using the device/browser language if we support it, else English.
function detectInitialLanguage() {
  const candidates = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for (const c of candidates) {
    const primary = c.toLowerCase().split('-')[0];
    if (I18N[primary]) return primary;
  }
  return 'en';
}
setLanguage(detectInitialLanguage());

// Register the service worker (PWA offline support). Safe no-op if the
// browser doesn't support it, or if served from file:// during local testing.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => { /* ignore */ });
  });
}

// note: no auto-run on load — the calculator starts empty and waits for the user
</script>
