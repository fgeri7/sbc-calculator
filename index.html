<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SBC Calculator</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f0c">
<meta name="background-color" content="#0a0f0c">
<meta name="description" content="Rating combination calculator for FIFA/EA FC Squad Building Challenges.">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SBC Calc">

<!-- Android / Chrome PWA support -->
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body{
    /* Disable the browser's native pull-to-refresh gesture while keeping
       normal vertical scrolling fully intact. */
    overscroll-behavior-y: contain;
  }
  :root{
    --bg:#0a0f0c;
    --panel:#121a15;
    --panel-2:#182219;
    --line:#22301f;
    --text:#e9f2ea;
    --muted:#8ea394;
    --accent:#3ddc84;
    --accent-dim:#1f5c3c;
    --gold:#e0b23d;
    --warn:#e0a13d;
    --error:#e0563d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(61,220,132,0.08), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(61,220,132,0.05), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0 0 60px;
  }
  .lang-bar{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    padding:14px 20px 0;
  }
  .floating-top{
    position:fixed;
    right:18px;
    bottom:24px;
    z-index:100;
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--accent);
    color:#06130c;
    border:none;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:opacity .2s, transform .2s;
  }
  .floating-top.visible{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .lang-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .lang-btn .flag{font-size:15px; line-height:1;}
  .lang-btn:hover{border-color:var(--accent); color:var(--accent);}
  .lang-btn.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  header{
    padding:24px 20px 24px;
    max-width:920px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin:0 0 10px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(26px,5vw,38px);
    margin:0 0 10px;
    line-height:1.15;
  }
  header p{
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    margin:0;
  }
  .tabs{
    display:flex;
    gap:4px;
    margin-top:20px;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    padding-bottom:2px;
  }
  .tab-btn{
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--muted);
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    font-weight:700;
    padding:9px 4px;
    margin-right:22px;
    cursor:pointer;
    white-space:nowrap;
    flex:0 0 auto;
    transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .help-panel{max-width:100%;}
  .help-h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    color:var(--accent);
    margin:22px 0 10px;
  }
  .help-h2:first-child{margin-top:0;}
  .help-panel p{
    font-size:14px;
    line-height:1.65;
    color:var(--text);
    margin:0 0 10px;
  }
  .help-list{
    margin:0 0 10px;
    padding-left:20px;
    font-size:14px;
    line-height:1.65;
  }
  .help-list li{margin-bottom:8px;}
  .help-nav{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:24px;
    padding-bottom:20px;
    border-bottom:1px dashed var(--line);
  }
  .help-nav button{
    background:var(--panel-2);
    border:1px solid var(--accent-dim);
    color:var(--accent);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:background .15s;
  }
  .help-nav button:hover{background:rgba(61,220,132,0.15);}
  .reverse-intro{
    font-size:14px;
    line-height:1.6;
    color:var(--muted);
    margin:0 0 18px;
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 0;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
    margin-bottom:24px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:14px;
    margin-bottom:18px;
  }
  .grid > div{
    min-width:0;
  }
  .target-block{
    margin-bottom:18px;
  }
  .target-block input[type=number]{
    font-size:26px;
  }
  .mandatory-block{
    margin-bottom:18px;
  }
  .grid.reverse-top-row{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  }
  @media (max-width:560px){
    .grid.reverse-top-row{
      grid-template-columns:minmax(0,1fr);
    }
  }
  .quick-select.quick-select-wrap{
    flex-wrap:wrap;
    overflow-x:visible;
    scroll-snap-type:none;
  }
  .grid.secondary{
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  }
  label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
  }
  .hint{
    display:block;
    font-family:'Inter',sans-serif;
    text-transform:none;
    letter-spacing:0;
    font-size:12px;
    color:var(--muted);
    margin-top:5px;
  }
  .quick-select{
    display:flex;
    flex-wrap:nowrap;
    gap:6px;
    margin-top:9px;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    padding-bottom:4px;
    min-width:0;
    max-width:100%;
  }
  .quick-select button{
    flex:0 0 auto;
    scroll-snap-align:start;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .quick-select button:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  .quick-select button.active{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:var(--accent);
  }
  input[type=number], input[type=text]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:700;
    padding:10px 12px;
    border-radius:7px;
    outline:none;
    transition:border-color .15s;
  }
  input[type=text]{
    font-size:16px;
    font-family:'JetBrains Mono',monospace;
  }
  input:focus{
    border-color:var(--accent);
  }
  input[type=number]::-webkit-inner-spin-button{opacity:0.5;}
  .field-wrap{position:relative;}
  .field-wrap input{padding-right:36px;}
  .field-clear{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    padding:5px 9px;
    border-radius:50%;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s, color .15s, background .15s;
  }
  .field-clear.visible{opacity:1; pointer-events:auto;}
  .field-clear:hover{color:#f2a08e; background:rgba(224,86,61,0.15);}
  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:20px 0 18px;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
    margin-bottom:6px;
  }
  .toggle-row input[type=checkbox]{
    width:18px;
    height:18px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .dual-slider-block{
    margin-bottom:18px;
  }
  .dual-slider-label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  .range-slider-wrap{
    position:relative;
    height:24px;
    margin:0 2px;
  }
  .range-track-bg{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:4px;
    background:var(--line);
    border-radius:2px;
    transform:translateY(-50%);
  }
  .range-track-fill{
    position:absolute;
    top:50%;
    height:4px;
    background:var(--accent);
    border-radius:2px;
    transform:translateY(-50%);
  }
  .range-slider{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    margin:0;
    transform:translateY(-50%);
    background:none;
    pointer-events:none;
    -webkit-appearance:none;
    appearance:none;
  }
  .range-slider::-webkit-slider-runnable-track{
    height:4px;
    background:transparent;
  }
  .range-slider::-moz-range-track{
    height:4px;
    background:transparent;
    border:none;
  }
  .range-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    pointer-events:auto;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #06130c;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.45);
    margin-top:-8px;
  }
  .range-slider::-moz-range-thumb{
    pointer-events:auto;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #06130c;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.45);
  }
  .range-ticks{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
  }
  button#calc{
    position:relative;
    overflow:hidden;
    background:var(--accent);
    color:#06130c;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 22px;
    border-radius:7px;
    cursor:pointer;
    width:100%;
    letter-spacing:0.01em;
    transition:filter .15s, transform .1s;
  }
  button#calc::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg);
    transition:left .5s ease;
  }
  button#calc:hover::before{left:120%;}
  button#calc:hover{filter:brightness(1.08);}
  button#calc:active{transform:scale(0.99);}
  button#calc:focus-visible, a.csv:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button#resetAll{
    width:100%;
    margin-top:10px;
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .secondary-btn{
    width:100%;
    margin-top:10px;
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s;
  }
  .secondary-btn:hover{background:rgba(61,220,132,0.1);}
  .plan-selector{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .plan-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    padding:7px 8px 7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .plan-pill.active{border-color:var(--accent); color:var(--accent); background:rgba(61,220,132,0.1);}
  .plan-pill .plan-del{
    background:none;
    border:none;
    color:inherit;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    padding:2px 6px;
    border-radius:50%;
  }
  .plan-pill .plan-del:hover{background:rgba(224,86,61,0.2); color:#f2a08e;}
  .plan-new-btn{
    background:none;
    border:1px dashed var(--accent-dim);
    color:var(--accent);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .plan-stepper{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .plan-stepper button{
    width:24px; height:24px;
    border-radius:6px;
    border:1px solid var(--accent-dim);
    background:var(--panel-2);
    color:var(--accent);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  .plan-stepper button:disabled{opacity:0.35; cursor:default;}
  .plan-stepper .plan-qty{
    min-width:14px;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .fav-star{
    background:none;
    border:none;
    color:var(--muted);
    font-size:17px;
    cursor:pointer;
    line-height:1;
    padding:2px 6px;
  }
  .fav-star:hover, .fav-star.starred{color:#ffd54a;}
  .copy-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    cursor:pointer;
    line-height:1;
    width:26px;
    height:26px;
    border-radius:6px;
    transition:border-color .15s, color .15s;
  }
  .copy-btn:hover{border-color:var(--accent); color:var(--accent);}
  .view-toggle{
    display:inline-flex;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:3px;
    gap:3px;
    margin-bottom:16px;
  }
  .view-toggle button{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    line-height:1;
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .view-toggle button.active{background:var(--accent); color:#06130c;}
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  @media (min-width:480px){
    .cards-grid{
      grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
      gap:12px;
    }
  }
  .combo-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
  }
  .combo-card-sum{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .combo-card-sum b{color:var(--text);}
  .combo-card-rows{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .combo-card-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    border-bottom:1px dashed var(--line);
    padding-bottom:4px;
  }
  .cc-rating{font-weight:700;}
  .cc-qty{color:var(--text); font-weight:700;}
  .combo-card-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:nowrap;
    gap:4px;
    margin-top:auto;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .combo-card-actions .plan-stepper{
    gap:3px;
    flex-shrink:0;
  }
  .combo-card-actions .plan-stepper button{
    width:20px;
    height:20px;
    font-size:12px;
  }
  .combo-card-actions .plan-qty{
    min-width:10px;
    font-size:11px;
  }
  .combo-card-actions .fav-star{
    font-size:15px;
    padding:2px 3px;
    flex-shrink:0;
  }
  .combo-card-actions .copy-btn{
    width:22px;
    height:22px;
    font-size:12px;
    flex-shrink:0;
  }
  .card-pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
  }
  .card-pagination button{
    background:var(--panel-2);
    border:1px solid var(--accent-dim);
    color:var(--accent);
    width:32px;
    height:32px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
  }
  .card-pagination button:disabled{opacity:0.3; cursor:default;}
  button#resetAll:hover{border-color:var(--error); color:#f2a08e;}
  .add-row{
    display:flex;
    gap:8px;
  }
  .add-row input{flex:1;}
  .qty-wrap{flex:0 0 auto;}
  #ownedQty{
    flex:0 0 auto !important;
    width:64px;
    text-align:center;
  }
  .add-row button{
    background:var(--accent-dim);
    color:var(--accent);
    border:1px solid var(--accent-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    padding:0 16px;
    border-radius:7px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .add-row button:hover{background:rgba(61,220,132,0.25);}
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
    min-height:0;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:2px;
    background:var(--panel-2);
    border:1px solid var(--accent-dim);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    padding:4px 6px;
    border-radius:20px;
  }
  .chip-value{
    padding:0 6px;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .chip-count-badge{
    background:var(--accent);
    color:#06130c;
    font-size:11px;
    font-weight:700;
    padding:2px 6px;
    border-radius:10px;
    line-height:1.4;
  }
  .chip-minus, .chip-plus{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--accent);

<script>
// ============================================================================
// Price lookup — fetches rating -> cheapest known price from a small
// Cloudflare Worker backend, which in turn sources data from sbccruncher.cc's
// public price API (used with the site owner's permission).
//
// Manual: only fetched when the user clicks "Fetch prices" on a results
// table (see wireFetchPricesButton, called from renderResultsHeader).
//
// To point this at a different deployment, just change PRICE_BACKEND_URL.
const PRICE_BACKEND_URL = 'https://sbc-price-backend.sbccalcfg.workers.dev';

const priceCache = new Map(); // rating (number) -> price (number)
let pricePlatform = 'pc'; // 'pc' | 'console'
let pricesFetchedOnce = false;

async function fetchPrices(platform) {
  const res = await fetch(`${PRICE_BACKEND_URL}/prices?platform=${platform}`);
  if (!res.ok) throw new Error('HTTP_' + res.status);
  const data = await res.json();
  if (data.status !== 'ok' || !data.prices) throw new Error('BAD_RESPONSE');
  priceCache.clear();
  Object.entries(data.prices).forEach(([rating, price]) => {
    priceCache.set(parseInt(rating, 10), Number(price));
  });
  pricesFetchedOnce = true;
}

function getPrice(rating) {
  return priceCache.has(rating) ? priceCache.get(rating) : null;
}

function formatPrice(p) {
  return p.toLocaleString();
}

// Cost of one row (sum of price*count over its columns). Rows with any
// unpriced rating sort to the end when comparing by price (Infinity).
function rowCost(snap, allRatings) {
  let sum = 0, missing = false;
  snap.counts.forEach((c, ci) => {
    if (c === 0) return;
    const price = getPrice(allRatings[ci]);
    if (price === null) { missing = true; return; }
    sum += price * c;
  });
  return missing ? Infinity : sum;
}

// Global sort-tiebreak preference, user-controllable via the "Sort by"
// toggle (rendered once prices are available). 'rating' = lowest total
// rating-sum decides ties (the original behaviour); 'price' = lowest real
// price decides ties. Preferred-rating tiers (①②③) always take priority
// over either tiebreak.
let sortMode = 'rating';

// Optional user-set price ceiling (number or null). A row is hidden only
// once its *known-certain* cost (ignoring ratings with no fetched price)
// already reaches or exceeds this limit — rows that are merely uncertain
// (some ratings unpriced) are never hidden just for that, since we can't
// be sure they're actually over budget.
let maxPriceFilter = null;

function rowCertainCost(snap, allRatings) {
  let sum = 0;
  snap.counts.forEach((c, ci) => {
    if (c === 0) return;
    const price = getPrice(allRatings[ci]);
    if (price !== null) sum += price * c;
  });
  return sum;
}

function getVisibleRows(ctx) {
  if (maxPriceFilter === null || priceCache.size === 0) return ctx.rowSnapshots;
  return ctx.rowSnapshots.filter(snap => rowCertainCost(snap, ctx.allRatings) <= maxPriceFilter);
}

// Re-sorts an already-built rowSnapshots list: preferred-rating tiers
// (①②③) still take top priority exactly as before, but the final
// tiebreaker is either the rating-sum or the real price, per `mode`.
function resortRows(ctx, mode) {
  const { allRatings, val1, val2, val3 } = ctx;
  const pIdx1 = (val1 != null && !Number.isNaN(val1)) ? allRatings.indexOf(val1) : -1;
  const pIdx2 = (val2 != null && !Number.isNaN(val2)) ? allRatings.indexOf(val2) : -1;
  const pIdx3 = (val3 != null && !Number.isNaN(val3)) ? allRatings.indexOf(val3) : -1;
  ctx.rowSnapshots.sort((a, b) => {
    if (pIdx1 !== -1 && a.counts[pIdx1] !== b.counts[pIdx1]) return b.counts[pIdx1] - a.counts[pIdx1];
    if (pIdx2 !== -1 && a.counts[pIdx2] !== b.counts[pIdx2]) return b.counts[pIdx2] - a.counts[pIdx2];
    if (pIdx3 !== -1 && a.counts[pIdx3] !== b.counts[pIdx3]) return b.counts[pIdx3] - a.counts[pIdx3];
    return mode === 'price'
      ? rowCost(a, allRatings) - rowCost(b, allRatings)
      : a.sum - b.sum;
  });
}

// Wired up from renderResultsHeader each time a results table is (re)drawn.
function wireFetchPricesButton() {
  const btn = document.getElementById('fetchPricesBtn');
  const status = document.getElementById('fetchPricesStatus');
  if (!btn) return;

  document.querySelectorAll('.platform-btn').forEach(pbtn => {
    pbtn.classList.toggle('active', pbtn.dataset.platform === pricePlatform);
    pbtn.addEventListener('click', () => {
      if (pbtn.dataset.platform === pricePlatform) return;
      pricePlatform = pbtn.dataset.platform;
      document.querySelectorAll('.platform-btn').forEach(b => b.classList.toggle('active', b === pbtn));
      if (pricesFetchedOnce) btn.click(); // re-fetch immediately for the new platform
    });
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    status.textContent = '…';
    status.className = 'price-status';
    try {
      await fetchPrices(pricePlatform);
      sortMode = 'price'; // switching to price tiebreak is the useful default right after a fetch
      if (lastResultsCtx) {
        resortRows(lastResultsCtx, sortMode);
        tablePage = 1;
        cardViewPage = 1;
        renderSortMessage(); // shows the "Sort by" toggle now that prices exist
        renderResultsBody();
      }
      status.textContent = 'OK';
      status.className = 'price-status ok';
    } catch (e) {
      status.textContent = 'Error (' + (e.message || e) + ')';
      status.className = 'price-status err';
    }
    btn.disabled = false;
  });
}

// Wires only the "Sort by" (rating/price) toggle buttons — kept separate
// from wireFetchPricesButton so re-rendering just the sort message (see
// renderSortMessage) never double-binds the platform/fetch buttons.
function wireSortModeToggle() {
  document.querySelectorAll('.sortmode-btn').forEach(sbtn => {
    sbtn.classList.toggle('active', sbtn.dataset.sortmode === sortMode);
    sbtn.addEventListener('click', () => {
      if (sbtn.dataset.sortmode === sortMode) return;
      sortMode = sbtn.dataset.sortmode;
      if (lastResultsCtx) {
        resortRows(lastResultsCtx, sortMode);
        tablePage = 1;
        cardViewPage = 1;
        renderSortMessage();
        renderResultsBody();
      }
    });
  });
}

// Builds the "results are ordered by..." message plus the Sort-by toggle
// (the toggle only appears once prices have been fetched at least once).
// Kept separate from the rest of the header so it can be refreshed on its
// own whenever sortMode or the fetched prices change, without re-rendering
// (and re-binding) the platform/fetch-prices controls above it.
function renderSortMessage() {
  const ctx = lastResultsCtx;
  if (!ctx) return;
  const container = document.getElementById('sortMsgArea');
  if (!container) return;
  const { idx1, idx2, idx3, val1, val2, val3 } = ctx;

  const activePrefs = [];
  if (idx1 !== -1) activePrefs.push(`① <b>${val1}</b>`);
  if (idx2 !== -1) activePrefs.push(`② <b>${val2}</b>`);
  if (idx3 !== -1) activePrefs.push(`③ <b>${val3}</b>`);

  const usingPrice = sortMode === 'price' && priceCache.size > 0;
  let text;
  if (activePrefs.length > 0) {
    const joined = activePrefs.join(`, ${T('thenWord')} `);
    text = T(usingPrice ? 'sortWithPrefsPrice' : 'sortWithPrefs', joined);
  } else {
    text = T(usingPrice ? 'sortNoPrefsPrice' : 'sortNoPrefs');
  }

  let toggle = '';
  let priceFilter = '';
  if (priceCache.size > 0) {
    toggle = `<div class="sortmode-toggle">
        <span class="sortmode-label">${T('sortByLabel')}</span>
        <button type="button" class="sortmode-btn" data-sortmode="rating">${T('sortByRating')}</button>
        <button type="button" class="sortmode-btn" data-sortmode="price">${T('sortByPrice')}</button>
      </div>`;
    priceFilter = `<div class="price-filter-row">
        <label for="maxPriceInput">${T('labelMaxPrice')}</label>
        <input type="number" id="maxPriceInput" min="0" placeholder="${T('maxPricePlaceholder')}" value="${maxPriceFilter !== null ? maxPriceFilter : ''}">
      </div>`;
  }

  container.innerHTML = `<div class="msg info">${text}</div>${toggle}${priceFilter}`;
  wireSortModeToggle();
  wireMaxPriceFilter();
}

function updateResultsCountDisplay() {
  const span = document.getElementById('resultsCountSpan');
  if (!span || !lastResultsCtx) return;
  const visibleCount = getVisibleRows(lastResultsCtx).length;
  span.textContent = maxPriceFilter !== null && priceCache.size > 0
    ? T('resultsCountFiltered', visibleCount, lastResultsCtx.total)
    : T('resultsCount', lastResultsCtx.total);
}

function wireMaxPriceFilter() {
  const input = document.getElementById('maxPriceInput');
  if (!input) return;
  input.addEventListener('input', () => {
    const v = input.value.trim();
    const parsed = v === '' ? null : parseInt(v, 10);
    maxPriceFilter = (parsed !== null && !Number.isNaN(parsed) && parsed >= 0) ? parsed : null;
    tablePage = 1;
    cardViewPage = 1;
    updateResultsCountDisplay();
    renderResultsBody();
  });
}

    helpHTML: `
      <div class="help-nav">
        <button type="button" data-jump="help-calc">Rechner</button>
        <button type="button" data-jump="help-plans">Meine Pläne</button>
        <button type="button" data-jump="help-favs">Favoriten</button>
        <button type="button" data-jump="help-reverse">Was kann ich bauen?</button>
      </div>

      <h2 class="help-h2" id="help-calc">Rechner</h2>
      <p>Gib das Ziel-Team-Rating, die Spieleranzahl und den Such-Rating-Bereich ein — der Rechner listet jede Kombination auf, die das Ziel exakt erreicht (echte FIFA/EA-FC-Formel mit Korrekturfaktor), und überspringt "verschwenderische" Varianten, bei denen ein Spieler ein Rating niedriger auch noch das Ziel erreichen würde.</p>
      <ul class="help-list">
        <li><b>Ziel-Team-Rating</b> — was die SBC verlangt. Ziehe im Schnellwahl-Streifen unter dem Feld (oder tippe einen Wert an), oder gib einen beliebigen Wert manuell ein; ein ×-Button leert das Feld.</li>
        <li><b>Anzahl Spieler</b> — Standard: 11, der häufigste Fall.</li>
        <li><b>Minimales / Maximales Rating</b> — der Suchbereich für die zusätzlich benötigten Spieler. Wird automatisch aus dem Ziel befüllt (Ziel − 5 / Ziel + 3), lässt sich aber manuell ändern oder per Schieberegler darunter visuell anpassen.</li>
        <li><b>Max. Spieler pro Rating (optional)</b> — begrenzt, wie viele Spieler in einem Ergebnis dasselbe Rating teilen dürfen — nützlich, wenn du nur wenige Exemplare einer Karte bekommen kannst.</li>
        <li>Checkbox <b>"Ich möchte Pflichtkarten und/oder bevorzugte Ratings angeben"</b> — blendet den erweiterten Bereich ein:
          <ul class="help-list">
            <li><b>Pflichtkarten</b> — Karten, die du bereits besitzt und unbedingt verwenden möchtest. Rating eingeben und Hinzufügen drücken (ein optionales Mengenfeld fügt mehrere auf einmal hinzu), oder im Schnellwahl-Streifen antippen, um sofort hinzuzufügen. Hinzugefügte Ratings erscheinen als Chips mit −/+-Zähler und einer Mengen-Badge (z.B. "88 ×5"); das × rechts entfernt alle Karten dieses Ratings auf einmal.</li>
            <li><b>1., 2., 3. bevorzugtes Rating</b> — die Suche bevorzugt Kombinationen mit den meisten Spielern dieser Ratings, in dieser Reihenfolge.</li>
          </ul>
        </li>
        <li><b>Als Favoritensuche speichern</b> — speichert deine aktuelle Feldkonfiguration unter einem selbstgewählten Namen, ladbar über den Favoriten-Tab.</li>
        <li><b>Alle Felder leeren</b> — setzt alle Felder auf diesem Tab zurück (Spieleranzahl wieder auf 11).</li>
      </ul>
      <p><b>Echte Preise abrufen:</b> sobald Ergebnisse vorliegen, erscheinen ein Plattform-Umschalter (PC / Konsole) und ein "💰 Preise abrufen"-Button. Der Abruf lädt aktuelle Marktpreise für die beteiligten Ratings; danach zeigt jedes Rating seinen Preis, und jede Zeile zeigt geschätzte Gesamtkosten (ein "≥"-Präfix bedeutet, dass für mindestens ein Rating in dieser Zeile kein Preis bekannt war). Danach erscheint ein "Sortieren nach: Rating / Preis"-Umschalter, mit dem du nach den günstigsten echten Kosten statt nach der niedrigsten Rating-Punktsumme sortieren kannst.</p>
      <p>Jede Ergebniszeile zeigt: die Zusammensetzung (🔒 markiert Spalten mit Pflichtkarte, Medaillenzahlen ①②③ markieren deine bevorzugten Ratings), die Gesamtpunktzahl (und nach Preisabruf die Kosten), einen +/− Zähler zum Hinzufügen/Entfernen aus deinem aktiven Plan, einen ☆-Stern zum Speichern als Favoritenkombination, und einen ⧉-Button zum Kopieren als Text (z.B. "2x85, 4x84, 5x83"). Mit ☰ / ▦ wechselst du zwischen Tabellen- und Kartenansicht — beide sind paginiert (50 Zeilen bzw. 15/12 Karten pro Seite), die Tabellenüberschrift bleibt beim Scrollen fixiert. Mit "CSV herunterladen" exportierst du die vollständige Liste.</p>

      <h2 class="help-h2" id="help-plans">Meine Pläne</h2>
      <p>Ein Plan ist ein gespeicherter Stapel von Team-Kombinationen — nützlich, wenn du an mehreren SBCs gleichzeitig arbeitest und die Gesamtsumme der benötigten Karten sehen möchtest.</p>
      <ul class="help-list">
        <li>Füge eine Kombination mit dem +-Button neben einem Ergebnis im Kalkulator- (oder Was-kann-ich-bauen-)Tab zum aktiven Plan hinzu; mit − entfernst du ein Exemplar. Dieselbe Kombination kann mehrfach hinzugefügt werden.</li>
        <li>Erstelle mit "+ Neuer Plan" bis zu 5 separate Pläne, damit sich verschiedene SBC-Projekte nicht vermischen. Doppeltipp auf einen Plannamen benennt ihn um; × löscht ihn.</li>
        <li>Beim Wechsel des aktiven Plans (oder Erstellen eines neuen) aktualisieren sich die +/−-Zähler in der Ergebnistabelle sofort — keine Neuberechnung nötig.</li>
        <li>"Plan leeren" leert nur den aktiven Plan; "Alle Pläne löschen" setzt alles auf einen einzigen leeren Plan zurück.</li>
        <li>Jeder gespeicherte Eintrag kann per ⧉ im Format "2x85, 4x84, ..." kopiert werden, und die Summentabelle unten addiert jedes benötigte Rating über den gesamten Plan.</li>
      </ul>

      <h2 class="help-h2" id="help-favs">Favoriten</h2>
      <ul class="help-list">
        <li><b>Favorisierte Suchen</b> (max. 5) — speichere deine aktuelle Kalkulator-Konfiguration mit Namen, dann per "Laden" sofort wiederherstellen. "Alle favorisierten Suchen entfernen" leert die ganze Liste.</li>
        <li><b>Favorisierte Kombinationen</b> (max. 5) — tippe auf ☆ bei einem Ergebnis, um es zu speichern; erneut tippen (★) entfernt es. "Alle favorisierten Kombinationen entfernen" leert die ganze Liste. Jede gespeicherte Kombination kann ebenfalls kopiert werden.</li>
      </ul>

      <h2 class="help-h2" id="help-reverse">Was kann ich bauen?</h2>
      <p>Besitzt du schon Karten? Dieser Modus arbeitet rückwärts: sag ihm, was du hast, und er sagt dir, welches Team-Rating möglich ist.</p>
      <ul class="help-list">
        <li><b>Benötigte Spieleranzahl</b> und ein optionales <b>gewünschtes Team-Rating</b> (mit eigenem Schnellwahl-Streifen) stehen nebeneinander.</li>
        <li><b>Vorhandene Karten</b> — Rating eingeben und Hinzufügen drücken (oder das optionale Mengenfeld nutzen, um mehrere auf einmal hinzuzufügen), oder im Schnellwahl-Streifen antippen. Genau wie bei Pflichtkarten erscheinen vorhandene Ratings als Chips mit −/+-Zähler, Mengen-Badge und einem ×, das alle Karten dieses Ratings auf einmal entfernt.</li>
        <li>Ohne Ziel-Rating zeigt es das bestmögliche Rating mit deinen besten Karten für diese Teamgröße.</li>
        <li>Mit Ziel sucht es nach exakten Kombinationen deiner Karten, die es erreichen — mit derselben Tabellen-/Kartenansicht, Paginierung und Plan-/Favoriten-/Kopier-Aktionen wie im Kalkulator-Tab. Falls keine existiert, zeigt es stattdessen die beste Alternative. (Der Preisabruf ist nur im Kalkulator-Tab verfügbar.)</li>
      </ul>

      <button type="button" class="secondary-btn" id="backToTop">↑ Nach oben</button>
`,

      <h2 class="help-h2" id="help-calc">Calculateur</h2>
      <p>Indiquez le rating d'équipe cible, le nombre de joueurs et la plage de rating à rechercher — le calculateur liste toutes les combinaisons atteignant exactement la cible (vraie formule FIFA/EA FC avec facteur de correction), en ignorant les variantes "gaspilleuses" où un joueur pourrait avoir un rating plus bas tout en atteignant encore la cible.</p>
      <ul class="help-list">
        <li><b>Rating d'équipe cible</b> — ce qu'exige la SBC. Faites glisser la bande de sélection rapide sous le champ (ou touchez une valeur), ou saisissez une valeur manuellement ; un bouton × efface le champ.</li>
        <li><b>Nombre de joueurs</b> — 11 par défaut, le cas le plus courant.</li>
        <li><b>Rating minimum / maximum</b> — la plage de recherche pour les joueurs supplémentaires nécessaires. Se remplit automatiquement à partir de la cible (cible − 5 / cible + 3), mais reste modifiable manuellement ou via le curseur en dessous pour ajuster la plage visuellement.</li>
        <li><b>Max. joueurs par rating (optionnel)</b> — limite le nombre de joueurs partageant le même rating dans un résultat, utile si vous ne pouvez obtenir que peu d'exemplaires d'une carte.</li>
        <li>Case <b>"Je veux définir des cartes obligatoires et/ou des ratings préférés"</b> — affiche la section avancée :
          <ul class="help-list">
            <li><b>Cartes obligatoires</b> — cartes que vous possédez déjà et voulez utiliser sans faute. Saisissez un rating et appuyez sur Ajouter (un champ de quantité optionnel permet d'en ajouter plusieurs d'un coup), ou touchez une valeur dans la bande de sélection rapide pour l'ajouter instantanément. Les ratings ajoutés s'affichent en jetons avec un compteur −/+ et un badge de quantité (ex. "88 ×5") ; le × à droite retire toutes les cartes de ce rating en un geste.</li>
            <li><b>1er / 2e / 3e rating préféré</b> — la recherche privilégie les combinaisons avec le plus de joueurs à ces ratings, dans cet ordre.</li>
          </ul>
        </li>
        <li><b>Enregistrer comme recherche favorite</b> — sauvegarde votre configuration actuelle sous un nom, rechargeable depuis l'onglet Favoris.</li>
        <li><b>Effacer tous les champs</b> — réinitialise tous les champs de cet onglet (nombre de joueurs revient à 11).</li>
      </ul>
      <p><b>Récupérer les prix réels :</b> une fois les résultats affichés, un sélecteur de plateforme (PC / Console) et un bouton "💰 Récupérer les prix" apparaissent. La récupération charge les prix actuels du marché pour les ratings concernés ; ensuite, chaque rating affiche son prix et chaque ligne affiche un coût total estimé (un préfixe "≥" signifie qu'un ou plusieurs ratings de cette ligne n'avaient pas de prix connu). Un sélecteur "Trier par : Rating / Prix" apparaît alors pour réordonner les résultats selon le coût réel le plus bas plutôt que la somme de points la plus basse.</p>
      <p>Chaque ligne de résultat affiche : la composition (🔒 marque les colonnes avec une carte obligatoire, les médailles ①②③ marquent vos ratings préférés), le total de points (et le coût, une fois les prix récupérés), un compteur +/− pour ajouter/retirer du plan actif, une étoile ☆ pour l'enregistrer en favori, et un bouton ⧉ pour la copier en texte (ex. "2x85, 4x84, 5x83"). Basculez entre vue tableau et vue cartes avec les boutons ☰ / ▦ — les deux sont paginées (50 lignes ou 15/12 cartes par page) et l'en-tête du tableau reste fixe au défilement. "Télécharger le CSV" exporte la liste complète.</p>

      <h2 class="help-h2" id="help-plans">Mes plans</h2>
      <p>Un plan est une pile enregistrée de combinaisons d'équipe — utile quand vous travaillez sur plusieurs SBC à la fois et voulez voir le total combiné de cartes nécessaires.</p>
      <ul class="help-list">
        <li>Ajoutez une combinaison au plan actif avec le bouton + à côté d'un résultat dans l'onglet Calculateur (ou Que puis-je construire ?) ; utilisez − pour en retirer un exemplaire. La même combinaison peut être ajoutée plusieurs fois.</li>
        <li>Créez jusqu'à 5 plans distincts avec "+ Nouveau plan", pour que différents projets SBC ne se mélangent pas. Double-tapez le nom d'un plan pour le renommer ; son × le supprime.</li>
        <li>Changer de plan actif (ou en créer un nouveau) met immédiatement à jour les compteurs +/− affichés dans le tableau des résultats — pas besoin de recalculer.</li>
        <li>"Vider le plan" ne vide que le plan actif ; "Supprimer tous les plans" réinitialise tout à un seul plan vide.</li>
        <li>Chaque élément enregistré peut être copié (⧉) au format "2x85, 4x84, ...", et le tableau des totaux en bas additionne chaque rating nécessaire pour tout le plan.</li>
      </ul>

      <h2 class="help-h2" id="help-favs">Favoris</h2>
      <ul class="help-list">
        <li><b>Recherches favorites</b> (5 max) — enregistrez votre configuration actuelle avec un nom, puis utilisez "Charger" pour la restaurer instantanément. "Supprimer toutes les recherches favorites" vide toute la liste.</li>
        <li><b>Combinaisons favorites</b> (5 max) — appuyez sur ☆ sur un résultat pour le marquer ; appuyez à nouveau (★) pour le retirer. "Supprimer toutes les combinaisons favorites" vide toute la liste. Chaque combinaison enregistrée peut aussi être copiée.</li>

        <li>Sans rating cible, il affiche le meilleur rating possible avec vos meilleures cartes pour cette taille d'équipe.</li>
        <li>Avec une cible, il cherche des combinaisons exactes de vos cartes l'atteignant — avec la même vue tableau/cartes, pagination, et actions plan/favori/copie que l'onglet Calculateur. Si aucune n'existe, il affiche la meilleure alternative. (La récupération des prix n'est disponible que dans l'onglet Calculateur.)</li>
      </ul>

    helpHTML: `
      <div class="help-nav">
        <button type="button" data-jump="help-calc">Calculadora</button>
        <button type="button" data-jump="help-plans">Os meus planos</button>
        <button type="button" data-jump="help-favs">Favoritos</button>
        <button type="button" data-jump="help-reverse">O que posso construir?</button>
      </div>

      <h2 class="help-h2" id="help-calc">Calculadora</h2>
      <p>Indica o rating de equipa alvo, o número de jogadores e o intervalo de rating a pesquisar — a calculadora lista todas as combinações que atingem exatamente o alvo (fórmula real da FIFA/EA FC com fator de correção), ignorando variantes "desperdiçadoras" em que um jogador poderia ter um rating mais baixo e ainda assim atingir o alvo.</p>
      <ul class="help-list">
        <li><b>Rating de equipa alvo</b> — o que o SBC exige. Arrasta a faixa de seleção rápida sob o campo (ou toca num valor), ou escreve qualquer valor manualmente; um botão × limpa o campo.</li>
        <li><b>Número de jogadores</b> — por defeito 11, o caso mais comum.</li>
        <li><b>Rating mínimo / máximo</b> — o intervalo de pesquisa para os jogadores adicionais necessários. Preenche-se automaticamente a partir do alvo (alvo − 5 / alvo + 3), mas podes editá-lo manualmente ou com o cursor por baixo para ajustar o intervalo visualmente.</li>
        <li><b>Máx. jogadores por rating (opcional)</b> — limita quantos jogadores num resultado podem partilhar o mesmo rating, útil se só conseguires poucas cópias de uma carta.</li>
        <li>Caixa <b>"Quero indicar cartas obrigatórias e/ou ratings preferidos"</b> — revela a secção avançada:
          <ul class="help-list">
            <li><b>Cartas obrigatórias</b> — cartas que já tens e queres usar de qualquer forma. Escreve um rating e prime Adicionar (um campo de quantidade opcional permite adicionar várias de uma vez), ou toca num valor na faixa de seleção rápida para adicionar de imediato. Os ratings adicionados aparecem como chips com um contador −/+ e uma etiqueta de quantidade (ex. "88 ×5"); o × à direita remove todas as cartas desse rating de uma vez.</li>
            <li><b>1º / 2º / 3º rating preferido</b> — a pesquisa prioriza combinações com mais jogadores destes ratings, por esta ordem.</li>
          </ul>
        </li>
        <li><b>Guardar como pesquisa favorita</b> — guarda a tua configuração atual com um nome, recarregável a partir do separador Favoritos.</li>
        <li><b>Limpar todos os campos</b> — repõe todos os campos deste separador (o número de jogadores volta a 11).</li>
      </ul>
      <p><b>Consultar preços reais:</b> assim que há resultados, aparecem um seletor de plataforma (PC / Consola) e um botão "💰 Consultar preços". A consulta obtém os preços atuais de mercado para os ratings envolvidos; depois, cada rating mostra o seu preço e cada linha mostra um custo total estimado (um prefixo "≥" significa que um ou mais ratings dessa linha não tinham preço conhecido). Aparece então um seletor "Ordenar por: Rating / Preço" para reordenar os resultados pelo custo real mais baixo em vez da soma de pontos mais baixa.</p>
      <p>Cada linha de resultado mostra: a composição (🔒 assinala colunas com carta obrigatória, os números ①②③ assinalam os teus ratings preferidos), a soma total de pontos (e o custo, depois de consultados os preços), um contador +/− para adicionar/remover do plano ativo, uma estrela ☆ para a guardar como favorita, e um botão ⧉ para a copiar como texto (ex. "2x85, 4x84, 5x83"). Alterna entre vista de tabela e de cartões com os botões ☰ / ▦ — ambas são paginadas (50 linhas ou 15/12 cartões por página) e o cabeçalho da tabela mantém-se fixo ao percorrê-la. "Transferir CSV" exporta a lista completa.</p>

      <h2 class="help-h2" id="help-plans">Os meus planos</h2>
      <p>Um plano é uma pilha guardada de combinações de equipa — útil quando trabalhas em vários SBC ao mesmo tempo e queres ver o total combinado de cartas necessárias.</p>
      <ul class="help-list">
        <li>Adiciona uma combinação ao plano ativo com o botão + junto a um resultado no separador Calculadora (ou O que posso construir?); usa − para remover uma unidade. A mesma combinação pode ser adicionada várias vezes.</li>
        <li>Cria até 5 planos distintos com "+ Novo plano", para que projetos SBC diferentes não se misturem. Toque duplo no nome de um plano para o renomear; o seu × elimina-o.</li>
        <li>Mudar o plano ativo (ou criar um novo) atualiza de imediato os contadores +/− na tabela de resultados — sem precisar de recalcular.</li>
        <li>"Limpar plano" só esvazia o plano ativo; "Eliminar todos os planos" repõe tudo para um único plano vazio.</li>
        <li>Cada item guardado pode ser copiado (⧉) no formato "2x85, 4x84, ...", e a tabela de totais em baixo soma cada rating necessário para todo o plano.</li>
      </ul>

      <h2 class="help-h2" id="help-favs">Favoritos</h2>
      <ul class="help-list">
        <li><b>Pesquisas favoritas</b> (máx. 5) — guarda a tua configuração atual com um nome, e usa "Carregar" para a restaurar de imediato. "Remover todas as pesquisas favoritas" esvazia toda a lista.</li>
        <li><b>Combinações favoritas</b> (máx. 5) — toca em ☆ num resultado para o guardares; toca novamente (★) para o remover. "Remover todas as combinações favoritas" esvazia toda a lista. Cada combinação guardada também pode ser copiada.</li>
      </ul>

      <h2 class="help-h2" id="help-reverse">O que posso construir?</h2>
      <p>Já tens algumas cartas? Este modo funciona ao contrário: diz-lhe o que tens, e ele diz-te que rating de equipa podes alcançar.</p>
      <ul class="help-list">
        <li><b>Número de jogadores necessários</b> e um <b>rating de equipa pretendido</b> opcional (com a sua própria faixa de seleção rápida) ficam lado a lado.</li>
        <li><b>Cartas que tens</b> — escreve um rating e prime Adicionar (ou usa o campo de quantidade opcional para adicionar várias de uma vez), ou toca na faixa de seleção rápida para adicionar de imediato. Tal como nas cartas obrigatórias, as cartas que tens aparecem como chips com um contador −/+, uma etiqueta de quantidade, e um × que remove todas as cartas desse rating de uma vez.</li>
        <li>Sem rating alvo, mostra o melhor rating possível com as tuas melhores cartas para esse tamanho de equipa.</li>
        <li>Com alvo, procura combinações exatas das tuas cartas que o atinjam — com a mesma vista de tabela/cartões, paginação e ações de plano/favorito/cópia que o separador Calculadora. Se nenhuma existir, mostra a melhor alternativa. (A consulta de preços só está disponível no separador Calculadora.)</li>
      </ul>

      <button type="button" class="secondary-btn" id="backToTop">↑ Voltar ao topo</button>
`,

let mandatoryList = [];

// Renders a value-count list as chips, e.g. "88 ×5", instead of one chip
// per individual card — much easier to scan when many duplicates are added.
// Clicking a chip (not its × ) adds one more of that value; the × removes
// exactly one instance (decrementing the count, or removing the chip at 1).
function buildAggregatedChipsHtml(list) {
  const counts = {};
  list.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const uniqueVals = Object.keys(counts).map(Number).sort((a, b) => b - a);
  return uniqueVals.map(val => {
    const count = counts[val];
    return `<span class="chip" data-val="${val}">
      <button type="button" class="chip-minus" data-val="${val}" title="${T('removeOneCard')}">−</button>
      <span class="chip-value">${val}${count > 1 ? `<span class="chip-count-badge">×${count}</span>` : ''}</span>
      <button type="button" class="chip-plus" data-val="${val}" title="${T('btnAdd')}">+</button>
      <button type="button" class="chip-remove" data-val="${val}" aria-label="${T('ariaRemove')}" title="${T('removeAllOfRating')}">×</button>
    </span>`;
  }).join('');
}

function wireAggregatedChips(containerEl, list, onChange) {
  containerEl.querySelectorAll('.chip-plus').forEach(btn => {
    btn.addEventListener('click', () => {
      list.push(parseInt(btn.dataset.val, 10));
      onChange();
    });
  });
  containerEl.querySelectorAll('.chip-minus').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = parseInt(btn.dataset.val, 10);
      const idx = list.indexOf(val);
      if (idx !== -1) list.splice(idx, 1);
      onChange();
    });
  });
  containerEl.querySelectorAll('.chip-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = parseInt(btn.dataset.val, 10);
      for (let i = list.length - 1; i >= 0; i--) {
        if (list[i] === val) list.splice(i, 1);
      }
      onChange();
    });
  });
}

function renderMandatoryChips() {
  if (mandatoryList.length === 0) {
    els.mandatoryChips.innerHTML = '';
    return;
  }
  let html = buildAggregatedChipsHtml(mandatoryList);
  html += `<button type="button" class="chips-clear" id="clearMandatory">${T('btnClearMandatory')}</button>`;
  els.mandatoryChips.innerHTML = html;

  wireAggregatedChips(els.mandatoryChips, mandatoryList, renderMandatoryChips);
  const clearBtn = document.getElementById('clearMandatory');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      mandatoryList = [];
      renderMandatoryChips();
    });
  }
}

function addMandatoryCard() {
  const raw = els.mandatoryInput.value.trim();
  if (raw === '') return;
  const v = parseInt(raw, 10);
  if (Number.isNaN(v) || v < 1 || v > 99) {
    showMessage(T('errMandatoryInvalid', raw), 'error');
    return;
  }
  mandatoryList.push(v);
  // Keep the value in the field (instead of clearing) so pressing Add/Enter
  // again quickly adds another copy of the same rating.
  els.mandatoryInput.focus();
  els.mandatoryInput.select();
  renderMandatoryChips();
}

const MAX_ESTIMATED_COMBOS = 3_000_000;

function nCrEstimate(n, k) {
  // estimate C(n, k) as a float, safe against overflow for our ranges
  k = Math.min(k, n - k);
  if (k < 0) return 0;
  let result = 1;
  for (let i = 0; i < k; i++) {
    result *= (n - i) / (i + 1);
    if (result > 1e15) return result; // already huge, bail early
  }
  return result;
}

// Compute squad rating for a full squad = mandatory cards + filler counts.
// Real FIFA/EA FC formula: average is not a plain mean — players above the
// average contribute an extra "correction factor" (CF). The (sum + CF) total
// is rounded to the nearest whole number, then divided by N and floored.
function computeSquadRating(mandatoryList, fillerCounts, ratingsList, n) {
  const mandatorySum = mandatoryList.reduce((a, b) => a + b, 0);
  let sum = mandatorySum;
  for (let i = 0; i < fillerCounts.length; i++) sum += fillerCounts[i] * ratingsList[i];
  const avg = sum / n;

  let cf = 0;
  for (const r of mandatoryList) {
    if (r > avg) cf += (r - avg);
  }
  for (let i = 0; i < fillerCounts.length; i++) {
    const r = ratingsList[i];
    if (r > avg) cf += fillerCounts[i] * (r - avg);
  }

  const rounded = Math.round(sum + cf);
  return Math.floor(rounded / n);
}

function showMessage(text, type) {
  els.messages.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

function clearMessage() {
  els.messages.innerHTML = '';
}

function ratingColor(r, min, max) {
  // gradient: teal (low) -> green (mid) -> gold (high), evoking FUT card tiers
  const t = max === min ? 1 : (r - min) / (max - min);
  const hue = 165 - t * 125; // 165 (teal/green) down to ~40 (gold)
  const sat = 55 + t * 15;
  const light = 50 + t * 6;
  return `hsl(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`;
}

// A small, dependency-free confetti burst near a results heading, celebrating
// a successful search (like a FUT pack reveal moment).
function fireConfetti(anchorEl) {
  if (!anchorEl) return;
  const rect = anchorEl.getBoundingClientRect();
  const colors = ['#3ddc84', '#ffd54a', '#c7cbd1', '#d99a5b', '#e9f2ea'];
  for (let i = 0; i < 14; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = `${rect.left + Math.random() * rect.width}px`;
    piece.style.top = `${rect.top + window.scrollY}px`;
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = `${Math.random() * 0.15}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 1400);
  }
}

// ---------- My Plans (up to 5 separate stacks, each can hold repeated combos) ----------
let plans = [{ name: null, items: [] }];
let activePlanIndex = 0;

function planDisplayName(i) {
  return plans[i].name || T('planDefaultName', i + 1);
}

function comboSignature(item) {
  return `${item.target}|${item.n}|` + item.allRatings.map((r, i) => `${r}:${item.counts[i]}`).join(',');
}

// "2x85, 4x84, 5x83" style text, highest rating first.
function formatComboText(item) {
  const parts = [];
  for (let i = item.allRatings.length - 1; i >= 0; i--) {
    if (item.counts[i] > 0) parts.push(`${item.counts[i]}x${item.allRatings[i]}`);
  }
  return parts.join(', ');
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}

function copyComboToClipboard(item, btn) {
  const text = formatComboText(item);
  const showCopied = () => {
    const original = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = original; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopied).catch(() => { fallbackCopy(text); showCopied(); });
  } else {
    fallbackCopy(text);
    showCopied();
  }
}

function addToPlan(snapshot, planIdx) {
  plans[planIdx].items.push(snapshot);
  renderPlan();
}

function removeOneFromPlan(snapshot, planIdx) {
  const sig = comboSignature(snapshot);
  const items = plans[planIdx].items;
  const idx = items.findIndex(it => comboSignature(it) === sig);
  if (idx !== -1) items.splice(idx, 1);
  renderPlan();
}

function countInPlan(snapshot, planIdx) {
  const sig = comboSignature(snapshot);
  return plans[planIdx].items.filter(it => comboSignature(it) === sig).length;
}

let lastRowSnapshots = null;

// Updates the little +/- counters shown next to each combo on the Calculator
// tab so they always reflect the currently active plan, without re-running
// the search itself.
function refreshCalculatorStepperCounts() {
  if (!lastRowSnapshots) return;
  document.querySelectorAll('#resultsPanel .plan-stepper').forEach(stepper => {
    const rowIdx = parseInt(stepper.dataset.row, 10);
    const snap = lastRowSnapshots[rowIdx];
    if (!snap) return;
    const q = countInPlan(snap, activePlanIndex);
    stepper.querySelector('.plan-qty').textContent = q;
    stepper.querySelector('.plan-minus').disabled = q === 0;
  });
}

function runReverseCalculation() {
  els.reverseMessages.innerHTML = '';
  els.reverseResultsPanel.innerHTML = '';

  const n = parseInt(els.reversePlayers.value, 10);
  const targetRaw = els.reverseTarget.value.trim();
  const target = targetRaw === '' ? null : parseInt(targetRaw, 10);

  if (Number.isNaN(n) || n < 1) {
    els.reverseMessages.innerHTML = `<div class="msg error">${T('errPlayersRange')}</div>`;
    return;
  }
  if (ownedList.length < n) {
    els.reverseMessages.innerHTML = `<div class="msg error">${T('errReverseNotEnough', ownedList.length, n)}</div>`;
    return;
  }

  // Best achievable rating: the squad rating formula is non-decreasing in
  // each individual card's rating, so using the n highest-rated owned cards
  // always maximises the result.
  const sortedDesc = ownedList.slice().sort((a, b) => b - a);
  const bestCards = sortedDesc.slice(0, n);
  const bestSr = computeSquadRating(bestCards, [], [], n);

  function describeCards(cards) {
    const counts = {};
    cards.forEach(c => { counts[c] = (counts[c] || 0) + 1; });
    return Object.keys(counts).map(Number).sort((a, b) => b - a)
      .map(r => `${counts[r]}×${r}`).join(' + ');
  }

  let html = `<div class="fixed-note"><b>${T('reverseMaxHead', n)}</b><br>${T('reverseMaxResult', bestSr)} — ${describeCards(bestCards)}</div>`;

  if (target !== null && !Number.isNaN(target)) {
    // Bounded subset search: group owned cards by rating with an available
    // count each, and enumerate how many of each rating to use (up to the
    // amount actually owned) so the chosen n cards hit the target exactly.
    const grouped = {};
    ownedList.forEach(v => { grouped[v] = (grouped[v] || 0) + 1; });
    const distinctRatings = Object.keys(grouped).map(Number).sort((a, b) => a - b);
    const availCounts = distinctRatings.map(r => grouped[r]);
    const k = distinctRatings.length;
    const counts = new Array(k).fill(0);
    let matches = [];

    function recurse(idx, slotsLeft) {
      if (matches.length > 5000) return;
      if (idx === k - 1) {
        if (slotsLeft > availCounts[idx]) { counts[idx] = 0; return; }
        counts[idx] = slotsLeft;
        const sr = computeSquadRating(
          distinctRatings.flatMap((r, i) => Array(counts[i]).fill(r)), [], [], n
        );
        if (sr === target) matches.push(counts.slice());
        counts[idx] = 0;
        return;
      }
      const cap = Math.min(slotsLeft, availCounts[idx]);
      for (let c = 0; c <= cap; c++) {
        counts[idx] = c;
        recurse(idx + 1, slotsLeft - c);
      }
      counts[idx] = 0;
    }
    recurse(0, n);

    function sumOfCounts(cnts) {
      let s = 0;
      for (let i = 0; i < cnts.length; i++) s += cnts[i] * distinctRatings[i];
      return s;
    }
    matches.sort((a, b) => sumOfCounts(a) - sumOfCounts(b));

    if (matches.length > 0) {
      const rowSnapshots = matches.map(cnts => {
        const sum = sumOfCounts(cnts);
        return { target, n, allRatings: distinctRatings.slice(), counts: cnts.slice(), sum };
      });
      lastReverseCtx = {
        rowSnapshots, target, n,
        minR: distinctRatings[0], maxR: distinctRatings[distinctRatings.length - 1],
        countText: T('reverseTargetFoundHead', matches.length, target, n),
      };
      reverseTablePage = 1;
      reverseCardPage = 1;
      html += '<div id="reverseMatchesArea"></div>';
      els.reverseResultsPanel.innerHTML = html;
      renderReverseMatches();
      fireConfetti(els.reverseResultsPanel);
      return;
    } else {
      html += `<div class="msg warn">${T('reverseTargetNotFound', target)}</div>`;
    }
  }

  els.reverseResultsPanel.innerHTML = html;
}

function runCalculation() {
  clearMessage();
  els.resultsPanel.innerHTML = '';

  const target = parseInt(els.target.value, 10);
  const n = parseInt(els.players.value, 10);
  const minR = parseInt(els.minR.value, 10);
  const maxR = parseInt(els.maxR.value, 10);
  const preferred1Raw = els.preferred1.value.trim();
  const preferred2Raw = els.preferred2.value.trim();
  const preferred3Raw = els.preferred3.value.trim();
  const preferred1 = preferred1Raw === '' ? null : parseInt(preferred1Raw, 10);
  const preferred2 = preferred2Raw === '' ? null : parseInt(preferred2Raw, 10);
  const preferred3 = preferred3Raw === '' ? null : parseInt(preferred3Raw, 10);
  const maxPerRatingRaw = els.maxPerRating.value.trim();
  const maxPerRating = maxPerRatingRaw === '' ? Infinity : parseInt(maxPerRatingRaw, 10);

  if ([target, n, minR, maxR].some(v => Number.isNaN(v))) {
    showMessage(T('errRequiredFields'), 'error');
    return;
  }
  if (minR > maxR) {
    showMessage(T('errMinMax'), 'error');
    return;
  }
  if (n < 1 || n > 30) {
    showMessage(T('errPlayersRange'), 'error');
    return;
  }
  if (maxPerRatingRaw !== '' && (Number.isNaN(maxPerRating) || maxPerRating < 1)) {
    showMessage(T('errPlayersRange'), 'error');
    return;
  }

  const mandatory = mandatoryList.slice();

  const mandatoryCount = mandatory.length;
  const mandatorySum = mandatory.reduce((a, b) => a + b, 0);
  const remaining = n - mandatoryCount;

  if (remaining < 0) {
    showMessage(T('errTooManyMandatory', mandatoryCount, n), 'error');
    return;
  }

  // Special case: mandatory cards already fill every slot — no search needed.
  if (remaining === 0) {
    const sr = computeSquadRating(mandatory, [], [], n);
    if (sr === target) {
      renderFixedOnlyResult(mandatory, target, n);
    } else {
      showMessage(T('warnFixedOnlyMismatch', mandatoryCount, sr, target), 'warn');
    }
    return;
  }

  if (target < minR - (maxR - minR) - 5 || target > maxR + 5) {
    showMessage(T('warnFarFromRange', target, minR, maxR), 'warn');
  }

  const k = maxR - minR + 1;
  const estimate = nCrEstimate(remaining + k - 1, k - 1);

  if (estimate > MAX_ESTIMATED_COMBOS) {
    showMessage(T('errEstimateTooBig', minR, maxR, k, remaining, Math.round(estimate).toLocaleString(I18N[currentLang].locale)), 'error');
    return;
  }

  const ratingsList = [];
  for (let r = minR; r <= maxR; r++) ratingsList.push(r);

  let found = [];
  let truncated = false;
  const counts = new Array(k).fill(0);

  // Silently drop "wasteful" combinations: if moving one filler player down
  // by exactly one rating tier still meets the target, a cheaper equivalent
  // already exists in the result set, so the original is redundant. This
  // also tests each mandatory card the same way (using this row's exact free
  // players) — if that specific mandatory card being one rating lower would
  // still hit the target here, this row is flagged as wasteful too, even
  // though the mandatory card itself always stays fixed in what's displayed.
  // This check runs inline, on every exact match, before it's ever stored —
  // otherwise a huge raw match count could exhaust the safety valve below
  // before filtering ever happens, silently truncating results in a way that
  // depends on search order rather than on any actual ranking.
  const uniqueMandatoryValues = Array.from(new Set(mandatory));
  function isDominated(cnts) {
    for (let i = k - 1; i >= 1; i--) {
      if (cnts[i] > 0) {
        const test = cnts.slice();
        test[i]--;
        test[i - 1]++;
        if (computeSquadRating(mandatory, test, ratingsList, n) >= target) return true;
      }
    }
    for (const m of uniqueMandatoryValues) {
      if (m > 1) {
        const idx = mandatory.indexOf(m);
        const testMandatory = mandatory.slice();
        testMandatory[idx] = m - 1;
        if (computeSquadRating(testMandatory, cnts, ratingsList, n) >= target) return true;
      }
    }
    return false;
  }

  // recursive stars-and-bars enumeration over k rating buckets summing to `remaining`
  function recurse(idx, slotsLeft) {
    if (found.length > 20000) { truncated = true; return; } // safety valve (now on the *kept* results, not raw matches)
    if (idx === k - 1) {
      if (slotsLeft > maxPerRating) { counts[idx] = 0; return; }
      counts[idx] = slotsLeft;
      const sr = computeSquadRating(mandatory, counts, ratingsList, n);
      if (sr === target && !isDominated(counts)) {
        found.push(counts.slice());
      }
      counts[idx] = 0;
      return;
    }
    const cap = Math.min(slotsLeft, maxPerRating);
    for (let c = 0; c <= cap; c++) {
      counts[idx] = c;
      recurse(idx + 1, slotsLeft - c);
    }
    counts[idx] = 0;
  }

  recurse(0, remaining);

  if (found.length === 0) {
    const core = T('warnNoCombosCore', remaining, minR, maxR, target);
    const suffix = mandatoryCount > 0 ? T('mandatoryNoteSuffix') : '';
    showMessage(`${core}${suffix}.`, 'warn');
    return;
  }

  if (truncated) {
    showMessage(T('warnResultsTruncated'), 'warn');
  }

  function sumOf(cnts) {
    let s = 0;
    for (let i = 0; i < cnts.length; i++) s += cnts[i] * ratingsList[i];
    return s;
  }

  function idxOf(val) {
    return (val !== null && !Number.isNaN(val)) ? ratingsList.indexOf(val) : -1;
  }
  const preferredIdx1 = idxOf(preferred1);
  const preferredIdx2 = idxOf(preferred2);
  const preferredIdx3 = idxOf(preferred3);

  // sort: most of priority-1 rating first, then priority-2, then priority-3,
  // then cheapest (lowest sum) as final tiebreaker
  found.sort((a, b) => {
    if (preferredIdx1 !== -1 && a[preferredIdx1] !== b[preferredIdx1]) {
      return b[preferredIdx1] - a[preferredIdx1];
    }
    if (preferredIdx2 !== -1 && a[preferredIdx2] !== b[preferredIdx2]) {
      return b[preferredIdx2] - a[preferredIdx2];
    }
    if (preferredIdx3 !== -1 && a[preferredIdx3] !== b[preferredIdx3]) {
      return b[preferredIdx3] - a[preferredIdx3];
    }
    return sumOf(a) - sumOf(b); // ascending
  });

  renderResults(found, ratingsList, target, n, minR, maxR, mandatory,
    [preferredIdx1, preferredIdx2, preferredIdx3], [preferred1, preferred2, preferred3]);
}

function renderFixedOnlyResult(mandatory, target, n) {

let lastResultsCtx = null;
let resultsViewMode = 'table';
let cardViewPage = 1;
function getCardsPerPage() {
  return window.matchMedia('(min-width: 480px)').matches ? 15 : 12;
}
let tablePage = 1;
const TABLE_PAGE_SIZE = 50;

function renderResults(found, ratingsList, target, n, minR, maxR, mandatory, preferredIdxs, preferredVals) {
  const total = found.length;
  const [idx1, idx2, idx3] = preferredIdxs;
  const [val1, val2, val3] = preferredVals;

  // Build the full set of displayed rating columns: the searched range plus
  // any mandatory ratings that fall outside it. Mandatory cards are then
  // folded into the same columns (marked with 🔒) so every row visibly shows
  // them as part of the composition, instead of a separate footnote.
  const allRatings = Array.from(new Set([...ratingsList, ...mandatory])).sort((a, b) => a - b);
  const lockedCounts = allRatings.map(r => mandatory.filter(m => m === r).length);
  const searchIdxOf = allRatings.map(r => (r >= minR && r <= maxR) ? ratingsList.indexOf(r) : -1);
  const preferredAllIdx = [val1, val2, val3].map(v => (v !== null && !Number.isNaN(v)) ? allRatings.indexOf(v) : -1);

  function tierOfAll(allI) {
    if (allI === preferredAllIdx[0] && preferredAllIdx[0] !== -1) return 1;
    if (allI === preferredAllIdx[1] && preferredAllIdx[1] !== -1) return 2;
    if (allI === preferredAllIdx[2] && preferredAllIdx[2] !== -1) return 3;
    return 0;
  }

  // Precompute every result's full (mandatory + filler) composition and sum
  // once, shared by both the table and card views. Nothing is truncated —
  // both views paginate over the complete list instead.
  const rowSnapshots = found.map(counts => {
    const rowTotalCounts = allRatings.map((r, i) => lockedCounts[i] + (searchIdxOf[i] !== -1 ? counts[searchIdxOf[i]] : 0));
    const rowSum = rowTotalCounts.reduce((acc, c, i) => acc + c * allRatings[i], 0);
    return { target, n, allRatings: allRatings.slice(), counts: rowTotalCounts.slice(), sum: rowSum };
  });

  lastResultsCtx = { found, rowSnapshots, allRatings, lockedCounts, tierOfAll, target, n, minR, maxR, mandatory, total, idx1, idx2, idx3, val1, val2, val3 };
  lastRowSnapshots = rowSnapshots;
  cardViewPage = 1;
  tablePage = 1;

  // A fresh search always starts from the preferred+rating-sum order above.
  // If the user had already fetched prices and switched to "sort by price"
  // on a previous search, keep honouring that choice immediately here too,
  // instead of silently showing the old rating-sum order until they happen
  // to re-toggle the sort buttons.
  if (sortMode === 'price' && priceCache.size > 0) {
    resortRows(lastResultsCtx, sortMode);
  }

  renderResultsHeader();
  renderResultsBody();
}

function renderResultsHeader() {
  const ctx = lastResultsCtx;
  if (!ctx) return;
  const { target, n, total, mandatory, idx1, idx2, idx3, val1, val2, val3 } = ctx;

  let html = '';
  html += `<div class="results-head">
      <h2>${T('resultsHead', target, n)} <span class="success-badge">${T('successBadge')}</span></h2>
      <span class="count" id="resultsCountSpan">${T('resultsCount', total)}</span>
      <div class="price-controls">
        <div class="platform-toggle">
          <button type="button" class="platform-btn" data-platform="pc">PC</button>
          <button type="button" class="platform-btn" data-platform="console">Console</button>
        </div>
        <button type="button" class="price-fetch-btn" id="fetchPricesBtn">💰 ${T('fetchPricesBtn')}</button>
        <span class="price-status" id="fetchPricesStatus"></span>
      </div>
    </div>`;

  html += `<div class="view-toggle" id="viewToggle">
      <button type="button" data-mode="table" class="${resultsViewMode === 'table' ? 'active' : ''}" title="${T('viewList')}">☰</button>
      <button type="button" data-mode="cards" class="${resultsViewMode === 'cards' ? 'active' : ''}" title="${T('viewCards')}">▦</button>
    </div>`;

  if (mandatory.length > 0) {
    html += `<div class="fixed-note">${T('fixedNoteLocked', mandatory.join(', '))}</div>`;
  }

  html += '<div id="sortMsgArea"></div>';

  html += '<div id="resultsBody"></div>';
  els.resultsPanel.innerHTML = html;
  wireFetchPricesButton();
  renderSortMessage();

  document.getElementById('viewToggle').querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      resultsViewMode = btn.dataset.mode;
      document.getElementById('viewToggle').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      cardViewPage = 1;
      tablePage = 1;
      renderResultsBody();
    });
  });

  // CSV export (uses the full found list, not just the shown/displayed rows)
  fireConfetti(els.resultsPanel.querySelector('.results-head'));
  const { found, allRatings, lockedCounts } = ctx;
  const minR = ctx.minR, maxR = ctx.maxR;
  const csvHeader = ['target_rating', ...allRatings.map(r => `rating_${r}`), 'total_sum'].join(',');
  const ratingsListForCsv = [];
  for (let r = minR; r <= maxR; r++) ratingsListForCsv.push(r);
  const searchIdxOf = allRatings.map(r => (r >= minR && r <= maxR) ? ratingsListForCsv.indexOf(r) : -1);
  const csvRows = found.map(counts => {
    const rowTotalCounts = allRatings.map((r, i) => lockedCounts[i] + (searchIdxOf[i] !== -1 ? counts[searchIdxOf[i]] : 0));
    const rowSum = rowTotalCounts.reduce((acc, c, i) => acc + c * allRatings[i], 0);
    return [target, ...rowTotalCounts, rowSum].join(',');
  });
  const csvContent = [csvHeader, ...csvRows].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);

  const headDiv = els.resultsPanel.querySelector('.results-head');
  const link = document.createElement('a');
  link.href = url;
  link.download = `rating-combinations-${target}-${n}players.csv`;
  link.className = 'csv';
  link.textContent = T('csvButtonText', total);
  headDiv.appendChild(link);
}

function renderResultsBody() {
  if (!lastResultsCtx) return;
  const bodyEl = document.getElementById('resultsBody');
  if (!bodyEl) return;
  if (resultsViewMode === 'cards') {
    renderCardView(bodyEl);
  } else {
    renderTableView(bodyEl);
  }
}

function wireComboActions(container, snapshots) {
  container.querySelectorAll('.plan-stepper').forEach(stepper => {
    const rowIdx = parseInt(stepper.dataset.row, 10);
    const snap = snapshots[rowIdx];
    const qtySpan = stepper.querySelector('.plan-qty');
    const minusBtn = stepper.querySelector('.plan-minus');
    stepper.querySelector('.plan-plus').addEventListener('click', () => {
      addToPlan(snap, activePlanIndex);
      const q = countInPlan(snap, activePlanIndex);
      qtySpan.textContent = q;
      minusBtn.disabled = false;
    });
    minusBtn.addEventListener('click', () => {
      removeOneFromPlan(snap, activePlanIndex);
      const q = countInPlan(snap, activePlanIndex);
      qtySpan.textContent = q;
      minusBtn.disabled = q === 0;
    });
  });
  container.querySelectorAll('.fav-star').forEach(btn => {
    btn.addEventListener('click', () => {
      const snap = snapshots[parseInt(btn.dataset.row, 10)];
      toggleFavoriteCombo(snap, btn);
    });
  });
  container.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const snap = snapshots[parseInt(btn.dataset.row, 10)];
      copyComboToClipboard(snap, btn);
    });
  });
}

function actionsHtml(rowIdx, snap) {
  const qty = countInPlan(snap, activePlanIndex);
  const isFav = favoriteCombos.some(it => comboSignature(it) === comboSignature(snap));
  return `<div class="plan-stepper" data-row="${rowIdx}">
      <button type="button" class="plan-minus" ${qty === 0 ? 'disabled' : ''} title="${T('removeFromPlanTitle')}">−</button>
      <span class="plan-qty">${qty}</span>
      <button type="button" class="plan-plus" title="${T('btnAddToPlan')}">+</button>
    </div>
    <button type="button" class="fav-star${isFav ? ' starred' : ''}" data-row="${rowIdx}" title="${T('btnSaveCombo')}">${isFav ? '★' : '☆'}</button>
    <button type="button" class="copy-btn" data-row="${rowIdx}" title="${T('btnCopy')}">⧉</button>`;
}

function renderTableView(bodyEl) {
  const ctx = lastResultsCtx;
  const { allRatings, lockedCounts, tierOfAll, minR, maxR } = ctx;
  const rowSnapshots = getVisibleRows(ctx);
  const totalPages = Math.max(1, Math.ceil(rowSnapshots.length / TABLE_PAGE_SIZE));
  if (tablePage > totalPages) tablePage = totalPages;
  const startIdx = (tablePage - 1) * TABLE_PAGE_SIZE;
  const pageSnaps = rowSnapshots.slice(startIdx, startIdx + TABLE_PAGE_SIZE);

  const anyPriceKnown = allRatings.some(r => getPrice(r) !== null);

  if (rowSnapshots.length === 0) {
    bodyEl.innerHTML = `<div class="msg warn">${T('noResultsUnderMaxPrice')}</div>`;
    return;
  }

  let html = '<div class="table-wrap"><table><thead><tr>';
  allRatings.forEach((r, i) => {
    const tier = tierOfAll(i);
    const tierClass = tier ? ` pref-${tier}` : '';
    const lockMark = lockedCounts[i] > 0 ? ' 🔒' : '';
    const price = getPrice(r);
    const priceTag = price !== null ? `<span class="price-tag">${formatPrice(price)}</span>` : '';
    html += `<th class="rating-col${tierClass}" style="--rc:${ratingColor(r, minR, maxR)}">${r}${lockMark}${priceTag}</th>`;
  });
  html += `<th>${T('colSum')}</th>`;
  if (anyPriceKnown) html += `<th class="cost-col">${T('colCost')}</th>`;
  html += `<th style="min-width:140px; text-align:left;">${T('colComposition')}</th><th></th><th></th><th></th></tr></thead><tbody>`;

  pageSnaps.forEach((snap, i) => {
    const rowIdx = startIdx + i;
    html += '<tr>';
    snap.counts.forEach((c, ci) => {
      const tier = tierOfAll(ci);
      if (c === 0) {
        html += '<td class="zero">–</td>';
      } else {
        html += `<td${tier ? ` class="pref-${tier}-cell"` : ''}>${c}</td>`;
      }
    });
    html += `<td>${snap.sum}</td>`;
    if (anyPriceKnown) {
      let cost = 0, missing = false;
      snap.counts.forEach((c, ci) => {
        if (c === 0) return;
        const price = getPrice(allRatings[ci]);
        if (price === null) { missing = true; return; }
        cost += price * c;
      });
      if (missing && cost === 0) html += '<td class="row-cost-cell">–</td>';
      else if (missing) html += `<td class="row-cost-cell" title="${T('colCost')}: some ratings in this row have no known price">≥ ${formatPrice(cost)}</td>`;
      else html += `<td class="row-cost-cell">${formatPrice(cost)}</td>`;
    }
    html += '<td class="bar-cell"><div class="bar">';
    const rowN = snap.counts.reduce((a, b) => a + b, 0) || 1;
    snap.counts.forEach((c, ci) => {
      if (c > 0) {
        const widthPct = (c / rowN) * 100;
        html += `<span style="width:${widthPct}%; background:${ratingColor(allRatings[ci], minR, maxR)}" title="${c}× ${allRatings[ci]}"></span>`;
      }
    });
    html += '</div></td>';
    html += `<td colspan="3" style="padding:0;"><div style="display:flex; align-items:center; gap:8px; padding:9px 12px;">${actionsHtml(rowIdx, snap)}</div></td>`;
    html += '</tr>';
  });

  html += '</tbody></table></div>';

  if (totalPages > 1) {
    html += `<div class="card-pagination">
      <button type="button" id="tablePrev" ${tablePage === 1 ? 'disabled' : ''}>‹</button>
      <span>${T('pageOf', tablePage, totalPages)}</span>
      <button type="button" id="tableNext" ${tablePage === totalPages ? 'disabled' : ''}>›</button>
    </div>`;
  }

  bodyEl.innerHTML = html;
  wireComboActions(bodyEl, rowSnapshots);

  const prevBtn = document.getElementById('tablePrev');
  const nextBtn = document.getElementById('tableNext');
  if (prevBtn) prevBtn.addEventListener('click', () => { tablePage--; renderTableView(bodyEl); });
  if (nextBtn) nextBtn.addEventListener('click', () => { tablePage++; renderTableView(bodyEl); });
}

function renderCardView(bodyEl) {
  const ctx = lastResultsCtx;
  const { allRatings, minR, maxR } = ctx;
  const rowSnapshots = getVisibleRows(ctx);
  if (rowSnapshots.length === 0) {
    bodyEl.innerHTML = `<div class="msg warn">${T('noResultsUnderMaxPrice')}</div>`;
    return;
  }
  const CARDS_PER_PAGE = getCardsPerPage();
  const totalPages = Math.max(1, Math.ceil(rowSnapshots.length / CARDS_PER_PAGE));
  if (cardViewPage > totalPages) cardViewPage = totalPages;
  const startIdx = (cardViewPage - 1) * CARDS_PER_PAGE;
  const pageSnaps = rowSnapshots.slice(startIdx, startIdx + CARDS_PER_PAGE);

  let html = '<div class="cards-grid">';
  pageSnaps.forEach((snap, i) => {
    const rowIdx = startIdx + i;
    const cost = rowCost(snap, allRatings);
    const costLine = cost !== Infinity
      ? `<div class="combo-card-sum">${T('colCost')}: <b>${formatPrice(cost)}</b></div>`
      : '';
    html += `<div class="combo-card">
      <div class="combo-card-sum">${T('colSum')}: <b>${snap.sum}</b></div>
      ${costLine}
      <div class="combo-card-rows">`;
    snap.allRatings.forEach((r, ci) => {
      if (snap.counts[ci] > 0) {
        const price = getPrice(r);
        const priceLabel = price !== null ? `<span class="price-tag">${formatPrice(price)}</span>` : '';
        html += `<div class="combo-card-row"><span class="cc-rating" style="color:${ratingColor(r, minR, maxR)}">${r}${priceLabel}</span><span class="cc-qty">${snap.counts[ci]}</span></div>`;
      }
    });
    html += `</div>
      <div class="combo-card-actions">${actionsHtml(rowIdx, snap)}</div>
    </div>`;
  });
  html += '</div>';

  if (totalPages > 1) {
    html += `<div class="card-pagination">
      <button type="button" id="cardPrev" ${cardViewPage === 1 ? 'disabled' : ''}>‹</button>
      <span>${T('pageOf', cardViewPage, totalPages)}</span>
      <button type="button" id="cardNext" ${cardViewPage === totalPages ? 'disabled' : ''}>›</button>
    </div>`;
  }

  bodyEl.innerHTML = html;
  wireComboActions(bodyEl, rowSnapshots);

  const prevBtn = document.getElementById('cardPrev');
  const nextBtn = document.getElementById('cardNext');
  if (prevBtn) prevBtn.addEventListener('click', () => { cardViewPage--; renderCardView(bodyEl); });
  if (nextBtn) nextBtn.addEventListener('click', () => { cardViewPage++; renderCardView(bodyEl); });
}
